<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Динамическая печать текста</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script></head><body><main><h2>Разработка <span id="typed" style="color:#16856e"></span><span aria-hidden="true">|</span></h2></main><script>const words=['лендингов','прелендингов','форм'];let w=0,n=0,back=false;setInterval(()=>{document.querySelector('#typed').textContent=words[w].slice(0,n);if(!back&&n===words[w].length)back=true;else if(back&&n===0){back=false;w=(w+1)%words.length;}else n+=back?-1:1;},160);</script></body></html>
