<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Крипто-калькулятор</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script></head><body><main><!--Calculator start-->
<div class="container-calc">
	<h2 style="text-align: center; font-weight: bold; color: #e8e8e8; margin-bottom: 20px; margin-top: 0;">Here you can calculate your net income</h2>
	<div class="calc-body">
		<div class="logo-block"> <span>ExtraCalc v3.5</span>
		</div>
		<div class="calc-screen">
			<div class="calc-operation"> <span class="no-title">The minimum deposit amount is $250</span>
			</div>
			<div class="calc-typed">
				<input class="input" min="250" id="screenInput" name="number1" type="text" size="10" maxlength="4" placeholder="0$" value="">
			</div>
		</div>
		<div class="calc-buuton">
			<button class="button" onclick="showresult('1')">Calculate</button>
		</div>
		<div class="сalc-main">
			<div class="calc-operation"> <span class="title">Your earnings will be like that:</span>
			</div>
			<div class="calc-result-block">
				<div class="result-block">
					<div class="text-b">In one day</div>
					<div class="count-b" id="j-res">
						<div id="j-res1">0</div>
						<div class="doll">$</div>
					</div>
				</div>
				<div class="result-block">
					<div class="text-b">In one week</div>
					<div class="count-b" id="j-res">
						<div id="j-res2">0</div>
						<div class="doll">$</div>
					</div>
				</div>
				<div class="result-block">
					<div class="text-b">In one month</div>
					<div class="count-b j-res" id="j-res">
						<div id="j-res3">0</div>
						<div class="doll">$</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>


 <script type="text/javascript">
function showresult() {
    let numScreen = parseFloat(document.getElementById("screenInput").value);
    let listRes = document.querySelectorAll("#j-res");
    let n2 = parseFloat("1.25");
    let r1;
    let r2;
    let r3;
    if (!Number.isInteger(numScreen)) {
        alert("The minimum deposit amount is $250");
        document.getElementById("j-res1").innerText = "0";
        document.getElementById("j-res2").innerText = "0";
        document.getElementById("j-res3").innerText = "0";
        for (let i = 0; i < listRes.length; i++) {
            let item = listRes[i];
            item.classList.remove("active");
        }
    } else if (Number.isInteger(numScreen) & (numScreen < 250)) {
        alert("The minimum deposit amount is $250");
        document.getElementById("screenInput").value = "250";
        outRes(250);
    } else {
        outRes();
    }

    function outRes(count1 = numScreen) {
        r1 = count1 * n2;
        r2 = count1 * n2 * 7;
        r3 = count1 * n2 * 30;
        document.getElementById("j-res1").innerText = Math.round(r1);
        document.getElementById("j-res2").innerText = Math.round(r2);
        document.getElementById("j-res3").innerText = Math.round(r3);
        for (let i = 0; i < listRes.length; i++) {
            let item = listRes[i];
            item.classList.add("active");
        }
    }
}
</script>
