<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BackFix / BackDetect</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script></head><body><main><h2>Backfix</h2><button id="enable">Начать проверку</button><output id="event-log">Перехват выключен</output></main><script>document.querySelector('#enable').onclick=()=>{history.pushState({backfix:true},'',location.href);demoLog('Состояние добавлено в историю');};window.addEventListener('popstate',()=>{demoLog('Сработал переход назад. В рабочем скрипте здесь открывается указанный URL.');});</script></body></html>
