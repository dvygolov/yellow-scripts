<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Динамическая замена картинки</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script></head><body><main><img id="main-image" class="sample" src="/assets/photo.jpg" alt="Горный пейзаж"><div class="row"><button data-image="/assets/photo.jpg">Первое изображение</button><button data-image="/assets/photo2.jpg">Второе изображение</button></div></main><script>document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>document.querySelector('#main-image').src=b.dataset.image);</script></body></html>
