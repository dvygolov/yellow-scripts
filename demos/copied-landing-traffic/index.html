<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подмена трафика и лидов в копиях лендинга</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script></head><body><main><h2>Проверка домена копии</h2><label>Домен страницы<input id="domain" value="copy.example"></label><button id="check">Проверить</button><output id="event-log"></output></main><script>document.querySelector('#check').onclick=()=>demoLog(document.querySelector('#domain').value==='original.example'?'Исходный домен: ссылка остаётся прежней.':'Чужой домен: обнаружена копия. В исходном скрипте здесь меняется адрес перехода.');</script></body></html>
