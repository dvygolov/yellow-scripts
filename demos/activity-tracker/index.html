<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ActivityTracker</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script></head><body><main><h2>Активность на странице</h2><button id="activity">Отметить действие</button><output id="event-log">Ожидание активности</output></main><script src="activity.js"></script><script>window.ym=(...args)=>demoLog(args);const tracker=new ActivityTracker(6,2,0);tracker.loop=false;tracker.init();document.querySelector('#activity').onclick=()=>demoLog('Действие зарегистрировано');</script></body></html>
