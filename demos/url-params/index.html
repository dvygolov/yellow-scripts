<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Прокидывание URL-меток в ссылки</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script></head><body><main><label>Входные метки<input id="query" value="utm_source=facebook&sub1=example"></label><p><a id="target" href="/demos/url-params/?offer=1">Ссылка на предложение</a></p><output id="url-result"></output></main><script>const input=document.querySelector('#query');function update(){const u=new URL('/demos/url-params/?offer=1',location.origin);new URLSearchParams(input.value).forEach((v,k)=>u.searchParams.set(k,v));document.querySelector('#target').href=u;document.querySelector('#url-result').textContent=u.href;}input.oninput=update;update();</script></body></html>
