<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FaviconFlicker</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script></head><body><main><div class="panel row"><img id="favicon-preview" width="64" height="64" alt="Текущая иконка вкладки"><strong>Yellow Scripts</strong></div></main><script src="ywbfaviconflicker.js"></script><script>setInterval(()=>{const l=document.querySelector('link[rel="shortcut icon"]');if(l)document.querySelector('#favicon-preview').src=l.href;},100);</script></body></html>
