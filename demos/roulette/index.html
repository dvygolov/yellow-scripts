<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рулетка CPARIP / WheelSpin</title><link rel="stylesheet" href="ywbroulette.css"><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script><meta name="yellow-demo" content="ready"></head><body><main><label>Колесо<select id="wheel"><option value="prizewheel.png" data-angle="67.5">Классическое · stopAngle: 67.5°</option><option value="wheels/multicolor.png" data-angle="315">Multicolor · stopAngle: 315°</option><option value="wheels/gradient.png" data-angle="0">Gradient · stopAngle: 0°</option><option value="wheels/blue-yellow.png" data-angle="180">Blue Yellow · stopAngle: 180°</option><option value="wheels/red-yellow.png" data-angle="67.5">Red Yellow · stopAngle: 67.5°</option><option value="wheels/coral-turquoise.png" data-angle="90">Coral Turquoise · stopAngle: 90°</option><option value="wheels/pastel.png" data-angle="0">Pastel · stopAngle: 0°</option><option value="wheels/discounts.png" data-angle="135">Discounts · stopAngle: 135°</option><option value="wheels/jackpot.png" data-angle="330">Jackpot · stopAngle: 330°</option><option value="wheels/colors.png" data-angle="0">Colors · stopAngle: 0°</option><option value="wheels/green-discount.png" data-angle="315">Green Discount · stopAngle: 315°</option><option value="wheels/bonus-spinner.png" data-angle="315">Bonus Spinner · stopAngle: 315°</option><option value="wheels/prize-gold.png" data-angle="315">Prize Gold · stopAngle: 315°</option></select></label><div id="roulette"></div><form id="roulette-form" class="order-form"><h2>Оформление заказа</h2><label>Имя<input name="name" autocomplete="name" required placeholder="Анна"></label><label>Телефон<input name="phone" type="tel" autocomplete="tel" required placeholder="+7 900 000-00-00"></label><button type="submit">Отправить заявку</button></form></main><script src="ywbroulette.js"></script><script>window.roulette=initRoulette({selectors:{roulette:'#roulette',form:'#roulette-form'},texts:{title:'Откройте свою скидку'}});</script><script>document.querySelector('#wheel').onchange=e=>{roulette.destroy();const option=e.target.selectedOptions[0];const outcome=({'wheels/pastel.png':'Светлый сектор','wheels/colors.png':'Зелёный сектор','wheels/jackpot.png':'JACKPOT','wheels/bonus-spinner.png':'50 FS','wheels/prize-gold.png':'50'})[option.value]||'Скидка 50%';window.roulette=initRoulette({selectors:{roulette:'#roulette',form:'#roulette-form'},image:option.value,stopAngle:Number(option.dataset.angle),texts:{title:'Испытайте удачу',popupTitle:outcome,popupText:'Результат соответствует сектору под указателем.',confirm:'Продолжить'}});};</script></body></html>
