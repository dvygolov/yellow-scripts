<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Маска и валидация телефона</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script></head><body><main><form class="order-form"><label>Телефон<input id="phone" type="tel" name="phone" placeholder="+7 (___) ___-__-__" required></label><button>Проверить</button><output id="phone-result"></output></form></main><script src="/vendor/inputmask.js"></script><script>Inputmask({mask:'+7 (999) 999-99-99',showMaskOnHover:false}).mask(document.querySelector('#phone'));document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#phone-result').textContent=document.querySelector('#phone').inputmask.isComplete()?'Маска заполнена':'Номер заполнен не полностью';});</script></body></html>
