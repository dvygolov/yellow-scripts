<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькулятор веса</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script></head><body><main><div class="two-col"><form class="order-form" id="weight"><label>Возраст<input type="number" min="1" max="120" name="age" value="35"></label><label>Рост, см<input type="number" min="80" max="250" name="height" value="170"></label><label>Вес, кг<input type="number" min="20" max="300" name="weight" value="65"></label></form><div class="weight-result"><h2>Результат формулы</h2><output id="weight-result"></output></div></div></main><script>function calc(){const f=document.querySelector('#weight'),a=Number(f.elements.age.value),h=Number(f.elements.height.value),w=Number(f.elements.weight.value),d=h-w;document.querySelector('#weight-result').textContent=a>0&&h>0&&w>0?'Рост − вес: '+d+'\nВетка исходника: '+(d>=115?'≥ 115':d>=104?'104–114':d>=90?'90–103':'≤ 89'):'Заполните все поля';}document.querySelector('#weight').oninput=calc;calc();</script></body></html>
