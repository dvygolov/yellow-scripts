<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сбор незавершённых лидов</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script></head><body><main><form id="order" class="order-form"><h2>Оформление заказа</h2><label>Имя<input name="name" autocomplete="name" required placeholder="Анна"></label><label>Телефон<input name="phone" type="tel" autocomplete="tel" required placeholder="+7 900 000-00-00"></label><button type="submit">Отправить заявку</button></form><output id="event-log">Ожидание ввода</output></main><script>let timer;const f=document.querySelector('form');function capture(){const fields=Object.fromEntries(new FormData(f));if(!fields.name&&!fields.phone)return;demoLog({event:'incomplete-lead',fields,network:'отправка отключена'});}f.querySelectorAll('input').forEach(i=>{i.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(capture,3500)});i.addEventListener('blur',()=>{clearTimeout(timer);timer=setTimeout(capture,3000)});});f.addEventListener('submit',()=>clearTimeout(timer));</script></body></html>
