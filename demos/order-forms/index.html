<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Четыре шаблона форм заказа</title><link rel="stylesheet" href="/demo.css"><script src="/demo-common.js"></script><meta name="yellow-demo" content="ready"></head><body><main><label>Вариант<select id="variant"><option value="form-1/index.html">Форма 1</option><option value="form-2/index.html">Форма 2</option><option value="form-3/index.html">Форма 3</option><option value="form-4/index.html">Форма 4</option></select></label><iframe title="Форма заказа" id="variant-frame" src="form-1/index.html" style="width:100%;height:240px;border:0" sandbox="allow-scripts allow-same-origin"></iframe></main><script>const select=document.querySelector('#variant'),frame=document.querySelector('#variant-frame');const initial=new URLSearchParams(location.search).get('variant');if(/^form-[1-4]$/.test(initial)){select.value=initial+'/index.html';frame.src=select.value;}select.onchange=()=>{frame.src=select.value;parent.postMessage({type:'yellow-demo-variant',variant:select.value.split('/')[0]},location.origin);};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='yellow-demo-height')frame.style.height=Math.max(100,Math.min(4000,e.data.height))+'px';});</script></body></html>
